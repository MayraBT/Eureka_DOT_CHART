<!-- item zoom: click any released/example item picture to see it full size -->
<style>
  img[src*="items/"]{cursor:zoom-in}
  .vpibody img[src*="items/"]{max-height:none}
  .zoomhint{display:block;font-size:12px;color:var(--ink-3);margin-top:4px}
  dialog#zoom{border:0;padding:0;border-radius:12px;max-width:min(96vw,1400px);max-height:94vh;background:#fff;box-shadow:0 10px 40px rgba(0,0,0,.35)}
  dialog#zoom::backdrop{background:rgba(15,25,25,.72)}
  #zoom .zbar{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 14px;background:#fff;border-bottom:1px solid var(--line);font-size:14px;color:var(--ink-2);z-index:1}
  #zoom .zbar button{font:inherit;font-size:14px;padding:5px 12px;border:1.5px solid var(--teal);border-radius:6px;background:#fff;color:var(--teal-deep);cursor:pointer}
  #zoom .zimg{overflow:auto;max-height:calc(94vh - 52px);padding:14px;text-align:center}
  #zoom .zimg img{display:inline-block;width:auto;max-width:none;height:auto;border:0;cursor:zoom-out}
  #zoom.fit .zimg img{max-width:100%}
  @media (max-width:820px){ dialog#zoom{max-width:100vw;max-height:100vh;border-radius:0} #zoom .zimg img{max-width:100%} }
</style>
<dialog id="zoom" class="fit" aria-label="Item enlarged"><div class="zbar"><span id="zcap"></span><span><button type="button" id="zsize">Actual size</button> <button type="button" id="zclose">Close ✕</button></span></div><div class="zimg"><img id="zpic" alt=""></div></dialog>
<script>
(function(){
  const dlg=document.getElementById('zoom'), pic=document.getElementById('zpic'), cap=document.getElementById('zcap'), sz=document.getElementById('zsize');
  function open(img){ pic.src=img.currentSrc||img.src; pic.alt=img.alt||''; cap.textContent=img.alt||'Item'; dlg.classList.add('fit'); sz.textContent='Actual size'; if(!dlg.open) dlg.showModal(); }
  document.addEventListener('click',e=>{ const img=e.target.closest&&e.target.closest('img'); if(!img||!/items\//.test(img.getAttribute('src')||'')||img.id==='zpic') return; e.preventDefault(); e.stopPropagation(); open(img); },true);
  sz.addEventListener('click',()=>{ const fit=dlg.classList.toggle('fit'); sz.textContent=fit?'Actual size':'Fit to window'; });
  pic.addEventListener('click',()=>dlg.close());
  document.getElementById('zclose').addEventListener('click',()=>dlg.close());
  dlg.addEventListener('click',e=>{ if(e.target===dlg) dlg.close(); });
  /* label item pictures as zoomable */
  const mark=()=>document.querySelectorAll('img[src*="items/"]:not([data-zh]):not(#zpic)').forEach(i=>{ i.dataset.zh=1; i.title='Click to enlarge'; if(!i.nextElementSibling||!i.nextElementSibling.classList.contains('zoomhint')) i.insertAdjacentHTML('afterend','<span class="zoomhint">Click the item to enlarge it</span>'); });
  new MutationObserver(mark).observe(document.body,{childList:true,subtree:true}); mark();
})();
</script>
